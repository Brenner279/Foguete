<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Prompts | Prof. Michel Brenner</title>

<style>
:root{
    --primary:#2563eb;
    --secondary:#7c3aed;
    --success:#10b981;
    --bg:#f1f5f9;
    --panel:#ffffff;
    --text:#334155;
    --muted:#64748b;
    --border:#e2e8f0;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.panel{
    background:var(--panel);
    border-radius:18px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:var(--primary);
}

.sub{
    text-align:center;
    color:var(--muted);
    margin-bottom:30px;
}

h2{
    margin-bottom:20px;
    color:var(--primary);
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#f8fafc;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:var(--primary);
    background:white;
}

.btn{
    width:100%;
    border:none;
    padding:16px;
    border-radius:12px;
    background:var(--primary);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    background:#1d4ed8;
}

.output{
    background:#0f172a;
    color:#f8fafc;
    border-radius:12px;
    padding:20px;
    min-height:500px;
    white-space:pre-wrap;
    font-family:monospace;
    overflow:auto;
}

.copy-btn{
    margin-top:15px;
    background:var(--success);
}

.copy-btn:hover{
    background:#059669;
}

.badge{
    background:#dbeafe;
    color:#1d4ed8;
    padding:3px 8px;
    border-radius:6px;
    font-size:12px;
}

@media(max-width:900px){
    .container{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<h1>🚀 Assistente Criativo - Professor Brenner</h1>
<p class="sub">
Gerador avançado de prompts para infográficos educacionais, apostilas e materiais didáticos.
</p>

<div class="container">

<!-- CONFIGURAÇÕES -->
<div class="panel">

<h2>📘 Gerador de Infográfico Educacional</h2>

<div class="form-group">
<label>📌 Disciplina</label>
<input type="text" id="disciplina" value="Matemática">
</div>

<div class="form-group">
<label>🎯 Assunto</label>
<input type="text" id="assunto" value="Função Exponencial">
</div>

<div class="form-group">
<label>👥 Público-Alvo</label>
<select id="publico">
<option>Ensino Fundamental I</option>
<option>Ensino Fundamental II</option>
<option selected>Ensino Médio</option>
<option>Ensino Superior</option>
</select>
</div>

<div class="form-group">
<label>
👤 Descrição do Personagem
<span class="badge">salvo automaticamente</span>
</label>

<textarea id="avatar" rows="4">
Professor sorridente, cabelo curto preto e camisa gola redonda azul escura, pele morena.
</textarea>
</div>

<div class="form-group">
<label>🎨 Estilo Visual</label>
<select id="estilo">
<option selected>
Disney Pixar 3D educational infographic style, ultra detailed, professional Brazilian school material
</option>

<option>
Hand-drawn doodle educational style
</option>

<option>
Minimalist vector infographic style
</option>
</select>
</div>

<button class="btn" onclick="gerarPrompt()">
✨ Gerar Prompt Profissional
</button>

</div>

<!-- RESULTADO -->
<div class="panel">

<h2>🤖 Prompt Gerado</h2>

<div class="output" id="resultado">
Seu prompt aparecerá aqui...
</div>

<button class="btn copy-btn" onclick="copiarPrompt()">
📋 Copiar Prompt
</button>

</div>

</div>

<script>

// ==========================
// SALVAR PERSONAGEM
// ==========================

document.addEventListener("DOMContentLoaded", () => {

    const avatarSalvo = localStorage.getItem("avatarEducacional");

    if(avatarSalvo){
        document.getElementById("avatar").value = avatarSalvo;
    }

});

document.getElementById("avatar").addEventListener("input", () => {

    localStorage.setItem(
        "avatarEducacional",
        document.getElementById("avatar").value
    );

});

// ==========================
// GERAR PROMPT
// ==========================

function gerarPrompt(){

    const disciplina = document.getElementById("disciplina").value;
    const assunto = document.getElementById("assunto").value;
    const publico = document.getElementById("publico").value;
    const avatar = document.getElementById("avatar").value;
    const estilo = document.getElementById("estilo").value;

    const prompt = `Crie um pôster educacional em formato retrato vertical (folha A4) extremamente detalhado, organizado e didático sobre o assunto "${assunto}" para a disciplina de ${disciplina}.

PÚBLICO-ALVO:
Estudantes do ${publico}.

OBJETIVO VISUAL:
O material deve parecer uma mistura de:
- apostila visual profissional brasileira,
- resumo de quadro,
- ficha de revisão escolar,
- infográfico didático completo.

O conteúdo deve ser pensado para:
- professores explicarem no quadro,
- alunos copiarem,
- servir como base para resolução de exercícios.

ESTRUTURA OBRIGATÓRIA:
O layout deve possuir MUITOS BLOCOS ORGANIZADOS, numerados e separados visualmente.

Organize o conteúdo em seções como:
1. Definição
2. Conceitos importantes
3. Fórmulas
4. Propriedades
5. Exemplos resolvidos
6. Gráficos ou figuras
7. Aplicações práticas
8. Exercícios rápidos
9. Resumo final

DENSIDADE DE CONTEÚDO:
- O pôster deve possuir MUITO CONTEÚDO VISÍVEL.
- Priorize textos explicativos curtos, fórmulas matemáticas, exemplos resolvidos, diagramas e tabelas.
- Evite grandes espaços vazios.
- O conteúdo deve ocupar praticamente toda a folha.
- Cada bloco deve conter:
  - título,
  - explicação curta,
  - fórmulas destacadas,
  - exemplos visuais.

ESTILO DE ORGANIZAÇÃO:
- Fundo branco ou papel de caderno extremamente suave.
- Caixas organizadas com bordas arredondadas.
- Cada seção deve ter uma cor própria suave e harmônica.
- Use tipografia grande e legível.
- Aparência limpa, acadêmica e extremamente organizada.
- Visual semelhante a materiais de revisão premium do Canva.

GRÁFICOS E FIGURAS:
- Use gráficos, figuras geométricas, esquemas, diagramas e ilustrações SOMENTE quando forem realmente úteis para explicar o conteúdo.
- As figuras devem ser educativas e não decorativas.
- Fórmulas matemáticas devem estar matematicamente corretas.

USO DO PERSONAGEM:
- O material deve conter o seguinte personagem:
"${avatar}"

- O personagem deve aparecer como professor/instrutor visual.
- Use o personagem apenas em pontos estratégicos:
  - canto superior,
  - segurando placas,
  - apontando fórmulas,
  - dando dicas,
  - próximo de exemplos.
- O personagem NÃO deve ocupar muito espaço.
- O conteúdo é mais importante que o personagem.

ESTILO VISUAL:
Siga rigorosamente o estilo:
"${estilo}"

QUALIDADE VISUAL:
- aparência ultra detalhada,
- cores vibrantes mas organizadas,
- estética profissional,
- composição rica,
- design moderno educacional brasileiro,
- estilo infográfico premium.

IMPORTANTE:
- NÃO gerar visual minimalista.
- NÃO deixar áreas vazias.
- NÃO criar excesso de elementos decorativos aleatórios.
- Priorizar organização didática.
- Priorizar conteúdo educativo.
- O resultado final deve parecer um material completo de revisão escolar profissional.

Render vertical A4, proporção 3:4.`;

    document.getElementById("resultado").textContent = prompt;
}

// ==========================
// COPIAR
// ==========================

function copiarPrompt(){

    const texto = document.getElementById("resultado").textContent;

    navigator.clipboard.writeText(texto);

    alert("Prompt copiado com sucesso!");

}

</script>

</body>
</html>
